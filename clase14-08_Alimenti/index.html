<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificador de Contraseñas Seguras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tarjeta">
    <h1>Verificador de Contraseñas</h1>
    <p class="subtitulo">TP 2 — Funciones y condicionales en JavaScript</p>

    <p><strong>Contraseña analizada:</strong> <span id="contrasena-mostrada">—</span></p>

    <ul class="resultados">
      <li>Longitud mínima (8 caracteres o más): <span id="resultado-longitud">—</span></li>
      <li>Tiene al menos un número: <span id="resultado-numero">—</span></li>
      <li>Tiene al menos una mayúscula: <span id="resultado-mayuscula">—</span></li>
    </ul>

    <p class="mensaje-final" id="mensaje-final"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
